<style>
/* Layout: one centred reading column (max 920px) per screen; pairwise screens split into two equal cards that stack on phones. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --ink: #1b2230;
  --muted: #5b6474;
  --line: #d9dde4;
  --accent: #2c5d8f;
  --accent-ink: #ffffff;
  --mark: #fbe38a;
  --mark-ink: #1b2230;
  --mark-b: #bfe3d6;
  --probe: #e2e9f6;
  --ok: #2f7a4f;
  --warn: #a5561b;
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1a2029; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2c3440;
    --accent: #7fb0e3; --accent-ink: #0e1724; --mark: #6b5a1c; --mark-ink: #fff6d6; --mark-b: #1f5546;
    --probe: #243450; --ok: #6cc596; --warn: #e3a36b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2c3440;
  --accent: #7fb0e3; --accent-ink: #0e1724; --mark: #6b5a1c; --mark-ink: #fff6d6; --mark-b: #1f5546;
  --probe: #243450; --ok: #6cc596; --warn: #e3a36b; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-left, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top-in { max-width: 920px; margin: 0 auto; display: flex; gap: 16px; align-items: center; justify-content: space-between; }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.prog { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.bar { width: 140px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
main { max-width: 920px; margin: 24px auto 0; display: grid; gap: 20px; }
h1, h2 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 30px; }
h2 { font-size: 22px; }
p { margin: 0; max-width: 68ch; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stack { display: grid; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.pred { display: inline-block; font-family: var(--f-mono); font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--probe); color: var(--ink); }
.qtext { font-size: 16px; font-weight: 500; }
table.feat { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.feat td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.feat td:first-child { color: var(--muted); width: 45%; }
table.feat td:last-child { font-family: var(--f-mono); font-size: 13px; word-break: break-word; }
.table-wrap { overflow-x: auto; max-height: 340px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
.textbox { font-size: 14.5px; line-height: 1.7; max-height: 320px; overflow-y: auto; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
.pairbox { display: grid; gap: 6px; font-size: 14.5px; }
.pairbox span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
mark { background: var(--mark); color: var(--mark-ink); padding: 0 2px; border-radius: 3px; }
.probe { background: var(--probe); outline: 1.5px solid var(--accent); border-radius: 3px; padding: 0 3px; font-weight: 600; }
.probe sup { font-size: 10px; color: var(--accent); margin-left: 1px; }
.imgwrap { position: relative; width: 100%; max-width: 320px; aspect-ratio: 1 / 1; }
.imgwrap img { width: 100%; height: 100%; display: block; border-radius: 6px; }
.imgwrap .box { position: absolute; border: 3px solid #f2c200; box-shadow: 0 0 0 1px rgba(0,0,0,.55); border-radius: 2px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px) { .cards { grid-template-columns: 1fr; } h1 { font-size: 25px; } .bar { width: 80px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card h3 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card .tag { font-family: var(--f-display); font-size: 22px; font-weight: 600; color: var(--ink); text-transform: none; letter-spacing: 0; margin-right: 6px; }
.ansline { font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--mark); color: var(--mark-ink); border-radius: 6px; padding: 2px 8px; font-size: 13px; font-family: var(--f-mono); max-width: 100%; word-break: break-word; }
.chip.empty { background: transparent; color: var(--muted); font-family: var(--f-body); padding: 0; }
.expl { font-size: 14.5px; line-height: 1.6; border-left: 3px solid var(--line); padding-left: 12px; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-weight: 500; padding: 0; margin-bottom: 6px; }
.scale7 { display: grid; grid-template-columns: auto repeat(7, minmax(0, 1fr)) auto; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.scale7 .end { font-weight: 600; color: var(--ink); white-space: nowrap; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt span { display: grid; place-items: center; min-height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.scale-labels { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 11px; color: var(--muted); text-align: center; margin-inline: 22px; }
@media (max-width: 520px) { .scale-labels { display: none; } .scale7 .end { font-size: 11px; } }
.likert { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.choice2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice2 .opt span { min-height: 52px; font-size: 15px; color: var(--ink); padding: 6px 10px; text-align: center; font-family: var(--f-mono); }
.row { display: flex; gap: 12px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
button { font: 600 15px var(--f-body); border-radius: 8px; padding: 10px 20px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.hint { font-size: 13px; color: var(--muted); }
.err { color: var(--warn); font-size: 13px; }
textarea, input[type=text], select { font: 14px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea.json { font-family: var(--f-mono); font-size: 12px; min-height: 160px; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 68ch; }
.code { font-family: var(--f-mono); font-size: 20px; letter-spacing: .1em; padding: 8px 14px; border: 1px dashed var(--accent); border-radius: 8px; display: inline-block; }
.legend-demo { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); }
.check { background: var(--probe); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
.cards4 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 720px) { .cards4 { grid-template-columns: 1fr; } }
.cards4 .imgwrap { max-width: 220px; }
.noexpl { color: var(--muted); font-style: italic; font-size: 14px; }
.evpanel { background: var(--surface); }
.evbars { display: grid; grid-template-columns: minmax(0, 11rem) 1fr auto; gap: 4px 10px; align-items: center; font-size: 13px; }
.evname { font-family: var(--f-mono); font-size: 12.5px; word-break: break-word; }
.evbar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.evbar i { display: block; height: 100%; background: var(--accent); }
.evbar i.neg { background: var(--warn); }
.evval { font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.agree { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.agree .opt span { min-height: 44px; padding: 4px 8px; text-align: center; color: var(--ink); font-size: 13px; }
@media (max-width: 600px) { .agree { grid-template-columns: 1fr 1fr; } }
.claims { display: grid; gap: 10px; }
.claim { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.ctext { font-size: 14.5px; }
.copts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.copts .opt span { min-height: 34px; color: var(--ink); font-size: 13px; }
.edpair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.edpair figure { margin: 0; display: grid; gap: 4px; }
.edpair figcaption { font-size: 11.5px; color: var(--muted); }
.edpair .imgwrap { max-width: 100%; }
.snips { display: grid; gap: 4px; font-size: 13.5px; line-height: 1.5; }
.snip { padding: 3px 8px; border-left: 2px solid var(--mark); background: var(--bg); border-radius: 0 4px 4px 0; word-break: break-word; }
.fdesc { font: 12px/1.4 var(--f-body); color: var(--muted); margin-top: 2px; }
.table-wrap { max-height: 420px; }
.focus { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; background: var(--probe); padding: 0 2px; }
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-direction: row-reverse; }
button.show { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
button.show.on { background: var(--accent); color: var(--accent-ink); }
.card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pick .opt span { min-height: 44px; font: 600 18px var(--f-display); color: var(--ink); }
</style>

const STUDY = {"version": 2, "selection": "high", "others": ["Qwen3.6_base", "Claude_Haiku", "Gemini_Flash", "GPT5.4_nano", "Tool"], "verify": [{"id": "V|tabular|adult_tabnn|q1|26148", "modality": "tabular", "dataset": "adult_tabnn", "q": "q1", "instance": "26148", "task": "Adult Census income", "question": "The model predicted the individual's income to be greater than 50K. Which input features were most responsible for this prediction?", "prediction": "greater than 50K", "truth": null, "focus": null, "input": {"kind": "table", "rows": [["age", "37"], ["workclass", "Private"], ["fnlwgt", "227545"], ["education", "Some-college"], ["education-num", "10"], ["marital-status", "Married-civ-spouse"], ["occupation", "Sales"], ["relationship", "Husband"], ["race", "White"], ["sex", "Male"], ["capital-gain", "0"], ["capital-loss", "0"], ["hours-per-week", "44"], ["native-country", "United-States"]]}, "expl": {"answer": {"features": ["marital-status", "relationship", "native-country", "sex"], "spans": [], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "The sensitivity analysis indicates that ablating these features causes the largest drops in prediction probability for the >50K class. Specifically, 'marital-status' has the highest importance with a probability drop of 0.0902, followed by 'relationship' at 0.0729. These features are the most critical drivers supporting the model's high-income prediction."}}, {"id": "V|tabular|adult_2layernn|q1|10055", "modality": "tabular", "dataset": "adult_2layernn", "q": "q1", "instance": "10055", "task": "Adult Census income", "question": "The model predicted the individual's income to be less than or equal to 50K. Which input features were most responsible for this prediction?", "prediction": "less than or equal to 50K", "truth": null, "focus": null, "input": {"kind": "table", "rows": [["age", "71"], ["workclass", "Private"], ["fnlwgt", "211707"], ["education", "Some-college"], ["education-num", "10"], ["marital-status", "Married-civ-spouse"], ["occupation", "Sales"], ["relationship", "Husband"], ["race", "White"], ["sex", "Male"], ["capital-gain", "0"], ["capital-loss", "0"], ["hours-per-week", "4"], ["native-country", "United-States"]]}, "expl": {"answer": {"features": ["hours-per-week", "age", "education-num", "fnlwgt"], "spans": [], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "The sensitivity analysis indicates that 'hours-per-week' has the highest positive probability drop when ablated, meaning its presence strongly supports the <=50K prediction. Other features like 'age', 'education-num', and 'fnlwgt' are also significant contributors to this class prediction based on their typical impact in income classification models, although their specific sensitivity scores were not listed as top positives in the summary."}}, {"id": "V|tabular|adult_2layernn|q5|32162", "modality": "tabular", "dataset": "adult_2layernn", "q": "q5", "instance": "32162", "task": "Adult Census income", "question": "The model predicted the individual\u2019s income to be less than or equal to 50K. If we mask the occupation feature of this input, would the prediction change?", "prediction": "less than or equal to 50K", "truth": null, "focus": {"features": ["occupation"]}, "input": {"kind": "table", "rows": [["age", "30"], ["workclass", "Private"], ["fnlwgt", "302473"], ["education", "HS-grad"], ["education-num", "9"], ["marital-status", "Never-married"], ["occupation", "Adm-clerical"], ["relationship", "Own-child"], ["race", "White"], ["sex", "Female"], ["capital-gain", "0"], ["capital-loss", "0"], ["hours-per-week", "40"], ["native-country", "United-States"]]}, "expl": {"answer": {"features": [], "spans": [], "box": null, "line": "Answer: the prediction would not change."}, "text": "The sensitivity analysis shows that masking the 'occupation' feature results in a very small probability drop of only 0.0252, reducing the confidence from 0.6687 to 0.6436. This indicates that the feature has low importance relative to others like 'marital-status', and the predicted class probability remains well above the decision threshold, so the prediction will not change."}}, {"id": "V|tabular|adult_2layernn|q8|24699", "modality": "tabular", "dataset": "adult_2layernn", "q": "q8", "instance": "24699", "task": "Adult Census income", "question": "The model predicted the individual to be >50K (True label was <=50K). Is there any irrelevant part in this input that causes the model\u2019s wrong prediction?", "prediction": ">50K", "truth": "<=50K", "focus": null, "input": {"kind": "table", "rows": [["age", "31"], ["workclass", "Private"], ["fnlwgt", "369825"], ["education", "Bachelors"], ["education-num", "13"], ["marital-status", "Never-married"], ["occupation", "Sales"], ["relationship", "Not-in-family"], ["race", "White"], ["sex", "Male"], ["capital-gain", "4101"], ["capital-loss", "0"], ["hours-per-week", "50"], ["native-country", "United-States"]]}, "expl": {"answer": {"features": ["fnlwgt", "capital-gain", "hours-per-week", "occupation"], "spans": [], "box": null, "line": "Highlighted: the irrelevant parts this explanation says caused the wrong prediction."}, "text": "These features have high positive attribution for the >50K class, driving the incorrect prediction. However, for a 31-year-old never-married individual, high capital gains or long working hours are not definitive indicators of high income without considering other factors like education or marital status which suggest lower earnings."}}, {"id": "V|text|snli_cnn|q1|106", "modality": "text", "dataset": "snli_cnn", "q": "q1", "instance": "106", "task": "SNLI sentence-pair inference", "question": "The model predicted the hypothesis to be entailment. Which input features were most responsible for this prediction?", "prediction": "entailment", "truth": null, "focus": null, "input": {"kind": "pair", "premise": "Three boys in white shirts are walking behind an older model Ford car.", "hypothesis": "there are three boys"}, "expl": {"answer": {"features": [], "spans": ["Ford", "are"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "The sensitivity analysis indicates that masking the words 'Ford' and 'are' results in the highest decrease in prediction confidence for the entailment class. This suggests that these specific tokens are the most critical features the model relies on to determine that the hypothesis is entailed by the premise."}}, {"id": "V|text|snli_2layernn|q1|140", "modality": "text", "dataset": "snli_2layernn", "q": "q1", "instance": "140", "task": "SNLI sentence-pair inference", "question": "The model predicted the hypothesis to be neutral. Which input features were most responsible for this prediction?", "prediction": "neutral", "truth": null, "focus": null, "input": {"kind": "pair", "premise": "A professional swimmer spits water out after surfacing while grabbing the hand of someone helping him back to land.", "hypothesis": "The swimmer almost drowned after being sucked under a fast current."}, "expl": {"answer": {"features": [], "spans": ["hand", "spits"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "The sensitivity analysis indicates that masking the words 'hand' and 'spits' results in the highest increase in prediction probability for the neutral class, with probability drops of 0.0587 and 0.0335 respectively. This suggests that these specific features are the most critical evidence supporting the neutral classification, as their removal significantly weakens the model's confidence in this prediction."}}, {"id": "V|text|imdb_cnn|q5|186", "modality": "text", "dataset": "imdb_cnn", "q": "q5", "instance": "186", "task": "IMDB movie-review sentiment", "question": "The model predicted the review to be negative. If we mask the word 'speeding' from this input, would the prediction change?", "prediction": "negative", "truth": null, "focus": {"spans": ["speeding"]}, "input": {"kind": "text", "text": "I was a hippie age 22 in 1965, have seen the play 5 times, have 2 versions of the music, and have read the script many times. Maybe taken as an separate thing, the movie is OK, but as an adoption of the play, it's terrible.<br /><br />First the good. The songs are sung well, and the production values are pretty good. The homosexual implications in Black Boys, White Boys is cute. The Claude/Berger switch was interesting. Hair is a fluid production, and constant changes in it are inherent provided the basic spirit of it is retained.<br /><br />But the basic spirit was very much distorted. It seemed like all the producer wanted was to sing certain songs, and fit the story-line to them regardless of what that did to the original intent of the play.<br /><br />Claude, Sheila, and Hud were presented as a selfish brats who could care less about anyone outside their tribe. Claude destroyed Sheila's parents party (it's hard to believe that she smiled while her parents were being hurt), and repeatedly stole cars. Sheila stole the soldier's clothes and car. Then she left him in the middle of the desert where he would certainly sunburn badly, probably be busted in rank, and could likely die on that lonely Nevada road. Good fun. And Hud found it fine to break his son's heart while yelling at his ex. This is not what hippies were like, not what the play described, and is directly opposite to a love generation.<br /><br />I've never seen a hippie beg for money. The point was to be self-sufficient outside the capitalist system, not beg from it.<br /><br />After Berger is thrown in jail for ruining Sheila's party and Claude offers to bail some out, Berger insists on being bailed instead, with no better plan for bailing the rest that hitting on Sheila's parents, and then hitting on his own mommy.<br /><br />\"Be In\" has always been a very spiritual point, but here it is wasted on silly brides floating around. Even if this is part of his trip, it ruins a beautiful song. I know they're contrasting \"Floating In Space\" with the Army. But again, it totally ruins a beautiful song.<br /><br />While Sheila and Claude are skinny dipping, Berger steals their clothes, laughing \"it was fun man\" even after he could see both were very annoyed. Then a little later, Berger does one thing that no hippie ever does. He hits Claude. Terrible.<br /><br />Then they have the perfect opportunity to sing \"Starshine\" at night in some beautiful SF spot with the stars twinkling down, maybe working into an inventive duet. Instead, the whole tribe sings it in the blazing sun speeding down the road in a convertible (stolen of course).<br /><br />I was vastly disappointed with the movie in 1979, and I like it even less now. I think it would have been possible to do a reasonably close adoption of the show, but this ain't it."}, "expl": {"answer": {"features": [], "spans": [], "box": null, "line": "Answer: the prediction would not change."}, "text": "The word 'speeding' is not listed among the most sensitive words in the sensitivity analysis, indicating it has low importance for the model's prediction. The most impactful words are strongly negative terms like 'terrible', suggesting the overall sentiment remains negative even if 'speeding' is masked."}}, {"id": "V|text|snli_2layernn|q8|561", "modality": "text", "dataset": "snli_2layernn", "q": "q8", "instance": "561", "task": "SNLI sentence-pair inference", "question": "The model predicted the relationship as neutral (true label was entailment). Is there any irrelevant part of the premise or hypothesis that caused the wrong prediction?", "prediction": "neutral", "truth": "entailment", "focus": null, "input": {"kind": "pair", "premise": "Four boys are about to be hit by an approaching wave.", "hypothesis": "A giant wave is about to crash on some boys."}, "expl": {"answer": {"features": [], "spans": ["Fo than actual earning potential. Despite high attribution from XAI tools, they lack semantic causal relationship to income and distract the model from substantive predictors like occupation and education-num, resulting in the narrow 52.68% confidence for the wrong class."}, "Gemini_Flash": {"answer": {"features": ["fnlwgt", "native-country"], "spans": [], "box": null, "line": "Highlighted: the irrelevant parts this explanation says caused the wrong prediction."}, "text": "The feature 'fnlwgt' (final weight) is a census-based statistical sampling weight that lacks genuine predictive power regarding individual income, yet acts as a noise-trap for the model. 'native-country' also serves as a spurious correlation in this context, distracting the model from key socioeconomic indicators like 'education-num' and 'occupation', causing the model to incorrectly lean toward the majority <=50K class."}, "GPT5.4_nano": {"answer": {"features": ["sex", "age", "hours-per-week", "relationship"], "spans": [], "box": null, "line": "Highlighted: the irrelevant parts this explanation says caused the wrong prediction."}, "text": "These features have high local attribution in the explanations (e.g., SHAP/IG/sensitivity highlight sex, age, hours-per-week, and sensitivity shows relationship is especially influential), yet they are not reliable semantic indicators of the true class (>50K) for this specific individual. The model\u2019s decision appears to be driven by spurious correlations between these attributes and the <=50K label rather than by the income-relevant financial signals (capital-gain/capital-loss), which are both 0 in the input."}}}, {"id": "R|text|imdb_2layernn|q1|281", "modality": "text", "dataset": "imdb_2layernn", "q": "q1", "instance": "281", "task": "IMDB movie-review sentiment", "question": "The model predicted the review to be negative. Which input features were most responsible for this prediction?", "prediction": "negative", "truth": null, "focus": null, "input": {"kind": "text", "text": "Despite the fact that this was a Made-For-TV movie (and an obvious one at that: ie., cheap looking), CLASS WARFARE left me wishing I could get my money back, and considering this lame production was partially funded through Canadian dollars, I might just be entitled.<br /><br />What made me sit through it in the first place was seeing actress Lindsey McKeon, who I've watched for the last couple years in her role as \"goody-goody\" Mara Lewis on the soap-opera GUIDING LIGHT, taking a turn at playing \"the bad girl\" for a change. <br /><br />Surprisingly she does quite well, as Kristen, a spoiled rich-b*tch who suddenly finds herself dirt-poor, but with a conniving streak, and a twist of fate, that will possibly change her fortunes back around. The twist of fate is provided in the character of Richard (Robin Dunne), a socially-radical outcast who discovers that he has just gone from having nothing to winning $23 million on a lottery ticket. Now, put Richard, Kristen, her jock-boyfriend Jason (Wade Carpenter), and their camcorder-obsessed mutual buddy Graham (Dave McGowan) together for the weekend in a remote cabin, cut off from the world by storms, and just guess what unfolds.<br /><br />The film suffers from congesting both the story and characters'personas and motives too much. Everyone is pretty one-dimensional and it doesn't take a rocket-scientist to figure out that some things, and some people, are going to go very bad, very quickly. I don't think this is that original a plot and it doesn't go out of it's way to make itself anything more. The acting is OK, McKeon is spot-on as the manipulative female lead, and Dunne is very good, perhaps a little too good at times, but no one else is worth writing home about. The only other real credit I can give the film is the one twist I didn't see coming towards the end (not the very end though, that one is so obvious it hurts). Regardless, I sat through all of it and lived to tell the tale so I can't say it was a complete write-off. <br /><br />4/10. A \"something-to-watch-when-nothing-else-is-on\" type movie."}, "expl": {"MEA": {"answer": {"features": [], "spans": ["dirt-poor,", "wishing", "soap-opera", "\"goody-goody\"", "one-dimensional", "bad", "bad,", "lame"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "The sensitivity analysis indicates that the model's prediction of a negative review is most strongly driven by the presence of these specific words. Removing 'dirt-poor,' causes the largest drop in confidence, followed by negative sentiment indicators like 'wishing', 'lame', and critical descriptors such as 'one-dimensional' and 'bad'. These features collectively signal the reviewer's dissatisfaction with the production quality and plot."}, "Qwen3.6_base": {"answer": {"features": [], "spans": ["Despite the fact that this was a Made-For-TV movie (and an obvious one at that: ie., cheap looking), CLASS WARFARE left me wishing I could get my money back, and considering this lame production was partially funded through Canadian dollars, I might just be entitled.", "The film suffers from congesting both the story and characters'personas and motives too much. Everyone is pretty one-dimensional and it doesn't take a rocket-scientist to figure out that some things, and some people, are going to go very bad, very quickly. I don't think this is that original a plot and it doesn't go out of it's way to make itself anything more."], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "These spans contain the strongest negative sentiment indicators identified by both the XAI tools and the grounding task, such as 'cheap looking', 'wishing I could get my money back', 'lame production', and 'one-dimensional'. They explicitly criticize the production quality, narrative originality, and character depth, which are the primary drivers for the negative classification. The high attribution scores for terms like 'one-dimensional' and 'bad' within these sections confirm their decisive role in the model's prediction."}, "Claude_Haiku": {"answer": {"features": [], "spans": ["Despite the fact that this was a Made-For-TV movie (and an obvious one at that: ie., cheap looking)", "left me wishing I could get my money back", "The film suffers from congesting both the story and characters'personas and motives too much", "Everyone is pretty one-dimensional", "I don't think this is that original a plot"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "These phrases form the structural backbone of the negative prediction. The opening critique establishes low production quality as a foundational negative frame, while 'wishing I could get my money back' explicitly expresses regret. The subsequent diagnostic statements ('suffers from,' 'one-dimensional,' 'not original') create a systematic argumentative structure that compounds disappointment through comparative framing. Together, these phrases account for the model's 96.96% confidence by establishing both explicit negative sentiment and the pervasive contextual pattern of failed expectations that dominates the review's evaluative logic."}, "Gemini_Flash": {"answer": {"features": [], "spans": ["wishing I could get my money back", "lame production", "one-dimensional"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "These specific phrases represent the highest attribution scores across both Integrated Gradients and LIME, capturing the user's explicit regret and the film's structural failures. The phrase 'wishing I could get my money back' serves as a definitive indicator of negative sentiment, while 'lame production' and 'one-dimensional' provide the technical and narrative justification the model uses to reach its high-confidence negative classification."}, "Tool": {"answer": {"features": [], "spans": ["bad", "lame", "goody", "just", "nothing", "and", "guess", "Surprisingly"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": ""}}}, {"id": "R|text|imdb_cnn|q1|170", "modality": "text", "dataset": "imdb_cnn", "q": "q1", "instance": "170", "task": "IMDB movie-review sentiment", "question": "The model predicted the review to be negative. Which input features were most responsible for this prediction?", "prediction": "negative", "truth": null, "focus": null, "input": {"kind": "text", "text": "OK I for one thought the trailer was quite good so was hopeful for this film, plus with the cast line up I was sure it couldn't get less than a 6 in my books. However I got annoyed half hour into the story... just where normal films get good, this film hit rock bottom. <br /><br />SPOILER * The guy who everyone is trying to help is so caring of other people getting hurt in the middle of the hustle that he turns on his colleagues to save a tramp and then locks himself inside one of the armoured trucks. Not only that, he constantly tries to get other peoples attention by which he ends up endangering more people and long story short, the outcome is that he is responsible for not just the tramps death, but also a police officer getting shot and the kidnapping of his younger brother... oh and all 5 of his colleagues dying disgraced deaths. <br /><br />But in the end he is HAPPY because he came to his senses halfway through the endeavour, so what if all his colleagues are now dead rather than sticking to the plan and being a millionaire. This film tried to be so politically correct it makes me sick! Ruined a good story. Shame really."}, "expl": {"MEA": {"answer": {"features": [], "spans": ["to", "be", "politically", "This", "tried", "then", "Not", "if", "cast", "was", "people", "save"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "The sensitivity analysis indicates that removing these words causes the largest decrease in the probability of the negative class prediction. Words like 'politically', 'This', and 'tried' are part of the final critical statement expressing strong dissatisfaction, which drives the negative sentiment classification. These features are most responsible for the model's confidence in predicting the review as negative."}, "Qwen3.6_base": {"answer": {"features": [], "spans": ["got annoyed half hour into the story", "this film hit rock bottom", "makes me sick", "Ruined a good story", "Shame really"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "These spans represent the core negative sentiment drivers identified by the XAI analysis, specifically capturing the shift from initial hope to intense disappointment. They include explicit emotional reactions like 'got annoyed' and 'makes me sick', as well as definitive judgments such as 'hit rock bottom' and 'Ruined a good story' that directly signal the negative class. The model prioritizes these strong negative indicators over the initial positive expectations to determine the final prediction."}, "Claude_Haiku": {"answer": {"features": [], "spans": ["However I got annoyed half hour into the story", "this film hit rock bottom", "This film tried to be so politically correct it makes me sick", "Ruined a good story"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "These phrases represent the critical turning points and strongest negative sentiment markers that drove the negative classification. The 'However' explicitly contradicts initial positive expectations, followed by hyperbolic criticism ('rock bottom'), ideological condemnation ('makes me sick'), and definitive negative judgment ('Ruined'). Together, they comprise the emotional and narrative core that transformed the review from positive opening to 75.86% negative prediction, with sensitivity analysis showing it all starts well, the film suffers the same imperfections you see in B-films. Its like at a certain moment the writer does not any more how to end the film, so he ends it in a way nobody suspects it thinking this way he is ingenious.<br /><br />A film to be listed on top of the garbage list.<br /><br />"}, "expl": {"MEA": {"answer": {"features": [], "spans": ["at", "a", "it", "certain", "in", "film,", "/>A", "way", "be", "a", "he"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "The sensitivity analysis indicates that masking these specific words results in the largest decreases in the predicted probability for the positive class. This suggests that the presence of these words is most critical for the model's confidence in classifying the review as positive, despite the review's overall negative sentiment."}, "Claude_Haiku": {"answer": {"features": [], "spans": ["it all starts well"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "Sensitivity analysis shows 'at' (from 'at a certain moment') as most sensitive with 0.1959 probability drop, but the GROUNDING and REASONING tasks identify 'it all starts well' as the primary false positive trigger. This positive phrase appears early in the review and the model failed to recognize it as a concession preceded by 'Although', instead treating it as genuine positive sentiment that disproportionately influenced the overall 77.91% positive prediction despite the overwhelmingly negative content that follows."}, "Gemini_Flash": {"answer": {"features": [], "spans": ["this", "does not any", "garbage list"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "The XAI analysis consistently identifies 'this', 'does', and 'any' as the strongest negative contributors across Integrated Gradients and LIME. While 'garbage list' carries the most negative semantic weight, the model's xpected to remain neutral."}, "Qwen3.6_base": {"answer": {"features": [], "spans": [], "box": null, "line": "Answer: the prediction would change."}, "text": "The LIME analysis identifies 'pushing' as a top positive contributor to the neutral prediction, indicating it is a key factor in the model's reasoning. The comparison task further suggests that the action alignment is crucial for maintaining the neutral stance against the subject mismatch, and removing it likely exposes the lack of entailment, potentially shifting the prediction to contradiction."}, "Claude_Haiku": {"answer": {"features": [], "spans": [], "box": null, "line": "Answer: the prediction would change."}, "text": "The word 'pushing' is identified as the second most sensitive word in sensitivity analysis (prob_drop: +0.0576, changing prediction from 0.4360 to 0.3784) and carries positive weight in LIME analysis (+0.0533). Multiple XAI analyses consistently indicate that masking 'pushing' would remove the critical semantic bridge connecting premise and hypothesis, likely shifting the prediction from neutral toward contradiction as the shared action element disappears."}, "Gemini_Flash": {"answer": {"features": [], "spans": [], "box": null, "line": "Answer: the prediction would change."}, "text": "The sensitivity analysis shows that 'pushing' is a high-impact token with a probability drop of +0.0576 upon masking. Given that the model's confidence for the 'neutral' classification is already relatively low (0.4360), the removal of this key semantic bridge significantly weakens the alignment between the premise and hypothesis, likely causing the model to shift its prediction toward 'contradiction'."}, "GPT5.4_nano": {"answer": {"features": [], "spans": [], "box": null, "line": "Answer: the prediction would change."}, "text": "The word 'pushing' is a top influential token across multiple XAI methods (e.g., integrated gradients and LIME list it among the most important). Sensitivity analysis also shows a noticeable probability shift when masking it (neutral confidence drops from 0.4360 to 0.3784), indicating the model relies on this action verb for the decision."}}}, {"id": "R|text|imdb_cnn|q8|1092", "modality": "text", "dataset": "imdb_cnn", "q": "q8", "instance": "1092", "task": "IMDB movie-review sentiment", "question": "The model predicted the review as positive (true label was negative). Is there any irrelevant part of the review that caused the model\u2019s wrong prediction?", "prediction": "positive", "truth": "negative", "focus": null, "input": {"kind": "text", "text": "This series takes a classic story and makes rubbish of it. Robin is somehow mystified by an elk-man in the forest and is embroiled in all sorts of druidism and outright satanic episodes. The story is more about him avoiding the evil sheriff than helping the poor. This is barely watchable. And to top all the ridiculousness they kill Robin at the end of series 2 and replace him with another actor. Some people may like this show as a fantasy show but it is NOT a Robin Hood show. If you want Robin fighting in king Richards name against Prince John and the sheriff and if you want Robin feeding the poor and oppressed, watch the classic series or the newest from the BBC."}, "expl": {"MEA": {"answer": {"features": [], "spans": ["it", "is", "and", "is", "an", "mystified", "him", "oppressed,", "the", "a", "makes"], "box": null, "line": "Highlighted: the irrelevant parts this explanation says caused the wrong prediction."}, "text": "The model incorrectly predicts positive sentiment largely due to its high sensitivity to common function words and neutral nouns such as 'it', 'is', and 'and'. These words have high attribution scores but do not carry the strong negative sentiment cues present in the review, such as 'rubbish' or 'barely watchable'. The model fails to prioritize these explicit negative indicators, instead relying on spurious correlations with frequent, semantically neutral tokens."}, "Qwen3.6_ba     const a = balancedPick(bank.filter(r => r.q === "q1"), n1, r => r.modality, rnd);
    const b = balancedPick(bank.filter(r => r.q !== "q1"), n - a.length, r => r.modality + r.q, rnd);
    return shuffle([...a, ...b], rnd);
  };
  const verify = pickWithQ1(STUDY.verify, Math.min(CONFIG.nVerify, STUDY.verify.length)).map(r => ({ id: r.id }));
  // Part 2: MEA + (perScreen-1) others; balance how often each other method is shown
  const seen = Object.fromEntries(STUDY.others.map(m => [m, 0]));
  const rank = pickWithQ1(STUDY.rank, Math.min(CONFIG.nRank, STUDY.rank.length)).map(r => {
    const avail = shuffle(Object.keys(r.expl).filter(m => m !== "MEA"), rnd).sort((a, b) => seen[a] - seen[b]);
    const chosen = avail.slice(0, CONFIG.perScreen - 1);
    chosen.forEach(m => seen[m]++);
    return { id: r.id, order: shuffle(["MEA", ...chosen], rnd) };
  });
  if (verify.length > 2) verify[Math.floor(verify.length / 2)].attn = true;
  if (rank.length > 2) rank[Math.floor(rank.length / 2)].attn = true;
  return { verify, rank };
}

/* ---------- rendering of inputs and explanations ---------- */
function highlightText(text, spans, focus) {
  // spans -> yellow <mark> (explanation); focus -> blue outline (part the question asks about)
  const lower = text.toLowerCase(), ivs = [];
  const add = (list, cls) => [...new Set((list || []).filter(s => s && s.trim()))].sort((a, b) => b.length - a.length).forEach(s => {
    const needle = s.toLowerCase().trim(); let from = 0, at;
    while ((at = lower.indexOf(needle, from)) !== -1) {
      const end = at + needle.length;
      const boundaryOk = needle.length > 3 || ((at === 0 || !/\w/.test(lower[at - 1])) && (end >= lower.length || !/\w/.test(lower[end])));
      if (boundaryOk && !ivs.some(([a, b]) => at < b && end > a)) ivs.push([at, end, cls]);
      from = end;
    }
  });
  add(focus, "focus");
  add(spans, "mark");
  ivs.sort((a, b) => a[0] - b[0]);
  let out = "", pos = 0;
  for (const [a, b, cls] of ivs) {
    const seg = esc(text.slice(a, b));
    out += esc(text.slice(pos, a)) + (cls === "mark" ? `<mark>${seg}</mark>` : `<span class="focus">${seg}</span>`);
    pos = b;
  }
  return out + esc(text.slice(pos));
}
function renderInput(item, ans) {
  const inp = item.input, fo = item.focus || {};
  if (inp.kind === "table") {
    const hi = new Set((ans?.features || []).map(f => f.toLowerCase()));
    const fc = new Set((fo.features || []).map(f => f.toLowerCase()));
    return `<div class="table-wrap"><table class="feat">${inp.rows.map(row => {
      const [k, v] = row, kk = k.toLowerCase();
      let name = hi.has(kk) ? `<mark>${esc(k)}</mark>` : esc(k);
      if (fc.has(kk)) name = `<span class="focus">${name}</span>`;
      const fd = featureDesc(item, k), vd = valueDesc(item, row);
      return `<tr><td>${name}${fd ? `<div class="fdesc">${esc(fd)}</div>` : ""}</td><td>${esc(v)}${vd ? `<div class="fdesc">${esc(vd)}</div>` : ""}</td></tr>`;
    }).join("")}</table></div>`;
  }
  if (inp.kind === "text") return `<div class="textbox">${highlightText(inp.text, ans?.spans, fo.spans)}</div>`;
  if (inp.kind === "pair") return `<div class="pairbox"><span>Premise</span><div class="textbox">${highlightText(inp.premise, ans?.spans, fo.spans)}</div><span>Hypothesis</span><div class="textbox">${highlightText(inp.hypothesis, ans?.spans, fo.spans)}</div></div>`;
  if (inp.kind === "image") return imageWithBox(inp, ans?.box);
  return "";
}

function featureDesc(item, name) {
  const ds = item.dataset.split("_")[0];
  if (ds === "adult") return ADULT_FEAT[name] || "";
  if (ds === "cancer") {
    let m;
    if ((m = name.match(/^mean (.+)$/)) && CANCER_BASE[m[1]]) return `Average ${CANCER_BASE[m[1]]}, over the nuclei in the image.`;
    if ((m = name.match(/^worst (.+)$/)) && CANCER_BASE[m[1]]) return `Largest (most abnormal) ${CANCER_BASE[m[1]]}: mean of the three largest values.`;
    if ((m = name.match(/^(.+) error$/)) && CANCER_BASE[m[1]]) return `How much the ${CANCER_BASE[m[1]]} varies between nuclei (standard error).`;
  }
  return "";
}
function valueDesc(item, row) {
  const ds = item.dataset.split("_")[0], [, v, pct] = row;
  if (ds === "adult") return ADULT_VAL[v] || "";
  if (ds === "cancer" && pct != null) return `higher than ${pct}% of samples in the dataset`;
  return "";
}
function cleanLabel(s) {
  return String(s ?? "").replace(/\b\d{3}\.([A-Za-z_]+)/g, (_, n) => n.replace(/_/g, " "));
}
function inputLegend(item, showingMarks) {
  const parts = [];
  if (showingMarks) parts.push(`<span><mark>yellow</mark> = highlighted by the explanation</span>`);
  if (item.focus) parts.push(`<span><span class="focus">outlined</span> = the part the question asks about</span>`);
  return parts.length ? `<div class="legend-demo">${parts.join("")}</div>` : "";
}
function imageWithBox(inp, box) {
  const [W, H] = inp.size || [224, 224];
  let b = "";
  if (box) {
    const [x1, y1, x2, y2] = box.map(Number);
    const l = Math.max(0, Math.min(x1, x2)), t = Math.max(0, Math.min(y1, y2)), r = Math.min(W, Math.max(x1, x2)), bt = Math.min(H, Math.max(y1, y2));
    b = `<div class="box" style="left:${100 * l / W}%;top:${100 * t / H}%;width:${100 * (r - l) / W}%;height:${100 * (bt - t) / H}%"></div>`;
  }
  return `<div class="imgwrap"><img src="${inp.src}" alt="Model input image">${b}</div>`;
}
function evidenceChips(item, ans) {
  if (item.input.kind === "image") {
    if (!ans.box) return "";
    if (!ans.edited) return imageWithBox(item.input, ans.box);
    return `<div class="edpair"><figure>${imageWithBox(item.input, ans.box)}<figcaption>Original, with the region to change</figcaption></figure>
      <figure><div class="imgwrap"><img src="${ans.edited}" alt="Image after applying this explanation's edit"></div><figcaption>After the change (generated by an image-editing model)</figcaption></figure></div>`;
  }
  const els = item.input.kind === "table" ? ans.features : ans.spans;
  if (!els || !els.length) return "";
  if (item.input.kind === "table") {
    const val = Object.fromEntries(item.input.rows.map(([k, v]) => [k.toLowerCase(), v]));
    return `<div class="chips">${els.map(f => `<span class="chip">${esc(f)}${val[f.toLowerCase()] != null ? " = " + esc(val[f.toLowerCase()]) : ""}</span>`).join("")}</div>`;
  }
  // text: show each highlighted span inside a few words of its surrounding context
  const full = item.input.kind === "pair" ? item.input.premise + " ‖ " + item.input.hypothesis : item.input.text;
  const lower = full.toLowerCase();
  return `<div class="snips">${els.slice(0, 8).map(s => {
    const at = lower.indexOf(s.toLowerCase().trim());
    if (at < 0) return `<div class="snip"><mark>${esc(s)}</mark></div>`;
    const end = at + s.trim().length;
    const before = full.slice(0, at).split(/\s+/).slice(-6).join(" "), after = full.slice(end).split(/\s+/).slice(0, 7).join(" ");
    return `<div class="snip">${at > 0 ? "…" : ""}${esc(before)} <mark>${esc(full.slice(at, end))}</mark>${esc(after.startsWith(" ") ? after : (/^\w/.test(full[end] || "") ? "" : "") + after)}…</div>`;
  }).join("")}${els.length > 8 ? `<div class="hint">+${els.length - 8} more highlighted</div>` : ""}</div>`;
}
function explanationCard(item, ex, tag) {
  return `<div class="card"><h3>${tag ? `<span class="tag">${tag}</span>` : ""}Explanation</h3>
    <div class="ansline">${esc(cleanLabel(ex.answer.line))}</div>

    ${ex.text ? `<div class="expl">${esc(ex.text)}</div>` : `<div class="noexpl">This explanation highlights parts of the input only and gives no written justification.</div>`}</div>`;
}
function header(item) {

function pick(name, q, n) {

const val = name => { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; };

/* ---------- state machine ---------- */
let S, tStart = 0;
function validState(st, pid) {
  // Saved progress is reused only if it matches this page's item bank exactly.
  try {
    if (!st || st.pid !== pid || !st.plan || !Array.isArray(st.plan.verify) || !Array.isArray(st.plan.rank)) return false;
    const vids = new Set(STUDY.verify.map(r => r.id)), rids = new Set(STUDY.rank.map(r => r.id));
    if (!st.plan.verify.every(t => vids.has(t.id)) || !st.plan.rank.every(t => rids.has(t.id))) return false;
    const n = 6 + st.plan.verify.length + st.plan.rank.length;
    return Number.isInteger(st.step) && st.step >= 0 && st.step < n && Array.isArray(st.responses);
  } catch (e) { return false; }
}
function resetProgress() {
  try { localStorage.removeItem("mea_state_" + CONFIG.studyVersion); } catch (e) {}
}
function init() {
  const pid = getPid();
  const saved = load("mea_state_" + CONFIG.studyVersion);
  S = STUDY && validState(saved, pid) ? saved : { pid, plan: buildPlan(pid), step: 0, responses: [], survey: null, started: Date.now() };
  safeRender();
}
function safeRender() {
  try { render(); }
  catch (e) {
    console.error(e);
    $("#app").innerHTML = `<div class="panel"><h2>Something went wrong</h2><p>The page could not show this step. Starting over usually fixes it.</p>
      <div class="row" style="justify-content:flex-start"><button id="reset" type="button">Start over</button></div></div>`;
    $("#reset").onclick = () => { resetProgress(); S = null; init(); };
  }
}
function steps() { return ["welcome", "howto", "verifyIntro", ...S.plan.verify.map((_, i) => "verify" + i), "rankIntro", ...S.plan.rank.map((_, i) => "rank" + i), "survey", "done"]; }
function save() { store("mea_state_" + CONFIG.studyVersion, S); }
function next() { S.step++; save(); safeRender(); window.scrollTo(0, 0); }

function render() {
  const cur = steps()[S.step], app = $("#app");
  const nTrials = S.plan.verify.length + S.plan.rank.length;
  $("#progbar").style.width = (100 * S.responses.length / Math.max(1, nTrials)) + "%";
  $("#progtxt").textContent = /^verify\d/.test(cur) ? `Part 1 · ${+cur.slice(6) + 1} of ${S.plan.verify.length}`
    : /^rank\d/.test(cur) ? `Part 2 · ${+cur.slice(4) + 1} of ${S.plan.rank.length}` : cur === "done" ? "Finished" : "";
  tStart = performance.now();
  if (!STUDY) { app.innerHTML = `<div class="panel"><p class="err">Study data is missing. Rebuild the page with build_study.py.</p></div>`; return; }
  if (cur === "welcome") return renderWelcome(app);
  if (cur === "howto") return renderHowto(app);
  if (cur === "verifyIntro") return renderIntro(app, "Part 1 of 2", "Rate an explanation",
    `<p>Each screen shows an input, the model's prediction, a question about the model, and one explanation that answers it.</p>
     <p>Read the explanation and answer three questions about it. There are no right or wrong answers; we want your judgment.</p>`);
  if (cur === "rankIntro") return renderIntro(app, "Part 2 of 2", "Pick the best and the worst",
    `<p>Each screen shows one input and question with <b>${CONFIG.perScreen} explanations</b>, labelled A to ${LETTERS[CONFIG.perScreen - 1]}, produced by different explanation systems. Some give a written justification, some only highlight parts of the input.</p>

}

    if (best === worst) { $("#err").textContent = "The most and least faithful explanations must be different."; return; }
    const m = L => t.order[LETTERS.indexOf(L)];
    S.responses.push({ block: "rank", id: t.id, modality: item.modality, q: item.q, shown: t.order, best: m(best), worst: m(worst),
      attn: t.attn ? attn === "C" : undefined, viewed: views.map(m), comment: $("#cmt").value.trim(), rt_ms: Math.round(performance.now() - tStart) });
    next();
  };
}

function renderSurvey(app) {
  app.innerHTML = `<div class="stack"><div class="eyebrow">Almost done</div><h2>A few questions about you</h2></div>
   <div class="panel">
    ${likert("ml", "How familiar are you with machine learning?", "not at all", "I work with it")}
    ${likert("ai", "How often do you use AI tools such as chatbots?", "never", "daily")}
    <label for="cm" class="hint">Any other comments on the explanations you saw?</label><textarea id="cm" rows="3"></textarea>
    <div class="row"><span class="err" id="err"></span><button id="go">Finish</button></div></div>`;
  $("#go").onclick = () => {
    const ml = val("ml"), ai = val("ai");
    if (ml == null || ai == null) { $("#err").textContent = "Please answer both rating questions."; return; }
    S.survey = { ml: +ml, ai: +ai, comment: $("#cm").value.trim() }; S.finished = Date.now(); next();
  };
}

/* Saving: (1) inside a claude.ai artifact with a signed-in viewer -> the artifact's database;
   (2) otherwise, if CONFIG.submitUrl is set -> POST to that backend (e.g. Google Apps Script);
   the participant never sees the raw responses. */
async function saveResponses(payload) {
  try {
    const db = window.claude?.use ? await window.claude.use("db") : null;
    const user = db ? await window.claude.use("user") : null;
    if (db && user) {
      const id = await user.id();
      await db.doc("responses/" + id).set({ ...payload, saved_at: Date.now() });
      return "saved";
    }
  } catch (e) { /* fall through to the HTTP backend */ }
  if (CONFIG.datapipeId) {
    // DataPipe (pipe.jspsych.org) stores one file per participant in your OSF project.
    const fname = `${payload.study}__${String(payload.pid).replace(/[^A-Za-z0-9_-]/g, "")}_${Date.now()}.json`;
    const r = await fetch("https://pipe.jspsych.org/api/data/", {
      method: "POST", headers: { "Content-Type": "application/json", Accept: "*/*" },
      body: JSON.stringify({ experimentID: CONFIG.datapipeId, filename: fname, data: JSON.stringify(payload) }) });
    if (!r.ok) throw new Error("DataPipe HTTP " + r.status);
    return "saved";
  }
  if (CONFIG.submitUrl) {
    const sameSite = CONFIG.submitUrl.startsWith("/") || new URL(CONFIG.submitUrl, location.href).origin === location.origin;
    if (sameSite) {
      // own server (e.g. the Flask app): a normal request whose result we can check
      const r = await fetch(CONFIG.submitUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return "saved";
    }
    // another site (e.g. Google Apps Script): text/plain avoids a CORS preflight; no-cors because the
    // response cannot be read cross-origin. The row is written regardless.
    await fetch(CONFIG.submitUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    return "sent";
  }
  return "none";
}

async function renderDone(app) {
  const payload = { study: CONFIG.studyVersion, pid: S.pid, started: S.started, finished: S.finished, plan: S.plan, responses: S.responses, survey: S.survey, ua: navigator.userAgent };
  const testing = location.hash === "#test";
  app.innerHTML = `<div class="stack"><div class="eyebrow">Finished</div><h1>Thank you</h1>
   <p id="sub">Saving your responses…</p>
   <div id="codebox" hidden><p>Your completion code:</p><span class="code">${esc(CONFIG.completionCode)}</span></div>
   <div class="row" style="justify-content:flex-start"><button id="retry" hidden>Try saving again</button>
   ${CONFIG.completionUrl ? `<a id="back" hidden href="${esc(CONFIG.completionUrl)}"><button type="button">Return to the study site</button></a>` : ""}
   ${testing ? `<button class="ghost" id="restart" type="button">Start over (testing)</button>` : ""}</div></div>`;
  if (testing) $("#restart").onclick = () => { try { localStorage.removeItem("mea_state_" + CONFIG.studyVersion); localStorage.removeItem("mea_pid"); } catch (e) {} init(); };
  const attempt = async () => {
    $("#retry").hidden = true; $("#sub").textContent = "Saving your responses…";
    let res;
    try { res = S.submitted ? "saved" : await saveResponses(payload); } catch (e) { res = "error"; }
    if (res === "saved" || res === "sent") {
      S.submitted = true; save();
      $("#sub").textContent = "Your responses have been recorded.";
      $("#codebox").hidden = false; if ($("#back")) $("#back").hidden = false;
    } else if (res === "none") {
      $("#sub").textContent = "This copy of the study is not connected to a server, so your responses were not recorded. Please contact the research team.";
    } else {
      $("#sub").textContent = "We could not save your responses. Please check your connection and try again; your answers are kept in this browser.";
      $("#retry").hidden = false;
    }
  };
  $("#retry").onclick = attempt;
  attempt();
}

init();
</script>
</body></html>
