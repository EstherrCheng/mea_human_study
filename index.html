<style>
/* Layout: one centred reading column (max 920px) per screen; pairwise screens split into two equal cards that stack on phones. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --ink: #1b2230;
  --muted: #5b6474;
  --line: #d9dde4;
  --accent: #2c5d8f;
  --accent-ink: #ffffff;
  --mark: #fbe38a;
  --mark-ink: #1b2230;
  --mark-b: #bfe3d6;
  --probe: #e2e9f6;
  --ok: #2f7a4f;
  --warn: #a5561b;
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1a2029; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2c3440;
    --accent: #7fb0e3; --accent-ink: #0e1724; --mark: #6b5a1c; --mark-ink: #fff6d6; --mark-b: #1f5546;
    --probe: #243450; --ok: #6cc596; --warn: #e3a36b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2c3440;
  --accent: #7fb0e3; --accent-ink: #0e1724; --mark: #6b5a1c; --mark-ink: #fff6d6; --mark-b: #1f5546;
  --probe: #243450; --ok: #6cc596; --warn: #e3a36b; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-left, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top-in { max-width: 920px; margin: 0 auto; display: flex; gap: 16px; align-items: center; justify-content: space-between; }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.prog { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.bar { width: 140px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
main { max-width: 920px; margin: 24px auto 0; display: grid; gap: 20px; }
h1, h2 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 30px; }
h2 { font-size: 22px; }
p { margin: 0; max-width: 68ch; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stack { display: grid; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.pred { display: inline-block; font-family: var(--f-mono); font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--probe); color: var(--ink); }
.qtext { font-size: 16px; font-weight: 500; }
table.feat { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.feat td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.feat td:first-child { color: var(--muted); width: 45%; }
table.feat td:last-child { font-family: var(--f-mono); font-size: 13px; word-break: break-word; }
.table-wrap { overflow-x: auto; max-height: 340px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
.textbox { font-size: 14.5px; line-height: 1.7; max-height: 320px; overflow-y: auto; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
.pairbox { display: grid; gap: 6px; font-size: 14.5px; }
.pairbox span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
mark { background: var(--mark); color: var(--mark-ink); padding: 0 2px; border-radius: 3px; }
.probe { background: var(--probe); outline: 1.5px solid var(--accent); border-radius: 3px; padding: 0 3px; font-weight: 600; }
.probe sup { font-size: 10px; color: var(--accent); margin-left: 1px; }
.imgwrap { position: relative; width: 100%; max-width: 320px; aspect-ratio: 1 / 1; }
.imgwrap img { width: 100%; height: 100%; display: block; border-radius: 6px; }
.imgwrap .box { position: absolute; border: 3px solid #f2c200; box-shadow: 0 0 0 1px rgba(0,0,0,.55); border-radius: 2px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px) { .cards { grid-template-columns: 1fr; } h1 { font-size: 25px; } .bar { width: 80px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card h3 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card .tag { font-family: var(--f-display); font-size: 22px; font-weight: 600; color: var(--ink); text-transform: none; letter-spacing: 0; margin-right: 6px; }
.ansline { font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--mark); color: var(--mark-ink); border-radius: 6px; padding: 2px 8px; font-size: 13px; font-family: var(--f-mono); max-width: 100%; word-break: break-word; }
.chip.empty { background: transparent; color: var(--muted); font-family: var(--f-body); padding: 0; }
.expl { font-size: 14.5px; line-height: 1.6; border-left: 3px solid var(--line); padding-left: 12px; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-weight: 500; padding: 0; margin-bottom: 6px; }
.scale7 { display: grid; grid-template-columns: auto repeat(7, minmax(0, 1fr)) auto; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.scale7 .end { font-weight: 600; color: var(--ink); white-space: nowrap; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt span { display: grid; place-items: center; min-height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.scale-labels { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 11px; color: var(--muted); text-align: center; margin-inline: 22px; }
@media (max-width: 520px) { .scale-labels { display: none; } .scale7 .end { font-size: 11px; } }
.likert { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.choice2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice2 .opt span { min-height: 52px; font-size: 15px; color: var(--ink); padding: 6px 10px; text-align: center; font-family: var(--f-mono); }
.row { display: flex; gap: 12px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
button { font: 600 15px var(--f-body); border-radius: 8px; padding: 10px 20px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.hint { font-size: 13px; color: var(--muted); }
.err { color: var(--warn); font-size: 13px; }
textarea, input[type=text], select { font: 14px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea.json { font-family: var(--f-mono); font-size: 12px; min-height: 160px; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 68ch; }
.code { font-family: var(--f-mono); font-size: 20px; letter-spacing: .1em; padding: 8px 14px; border: 1px dashed var(--accent); border-radius: 8px; display: inline-block; }
.legend-demo { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); }
.check { background: var(--probe); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
.cards4 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 720px) { .cards4 { grid-template-columns: 1fr; } }
.cards4 .imgwrap { max-width: 220px; }
.noexpl { color: var(--muted); font-style: italic; font-size: 14px; }
.evpanel { background: var(--surface); }
.evbars { display: grid; grid-template-columns: minmax(0, 11rem) 1fr auto; gap: 4px 10px; align-items: center; font-size: 13px; }
.evname { font-family: var(--f-mono); font-size: 12.5px; word-break: break-word; }
.evbar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.evbar i { display: block; height: 100%; background: var(--accent); }
.evbar i.neg { background: var(--warn); }
.evval { font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.agree { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.agree .opt span { min-height: 44px; padding: 4px 8px; text-align: center; color: var(--ink); font-size: 13px; }
@media (max-width: 600px) { .agree { grid-template-columns: 1fr 1fr; } }
.claims { display: grid; gap: 10px; }
.claim { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.ctext { font-size: 14.5px; }
.copts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.copts .opt span { min-height: 34px; color: var(--ink); font-size: 13px; }
.edpair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.edpair figure { margin: 0; display: grid; gap: 4px; }
.edpair figcaption { font-size: 11.5px; color: var(--muted); }
.edpair .imgwrap { max-width: 100%; }
.snips { display: grid; gap: 4px; font-size: 13.5px; line-height: 1.5; }
.snip { padding: 3px 8px; border-left: 2px solid var(--mark); background: var(--bg); border-radius: 0 4px 4px 0; word-break: break-word; }
.fdesc { font: 12px/1.4 var(--f-body); color: var(--muted); margin-top: 2px; }
.table-wrap { max-height: 420px; }
.focus { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; background: var(--probe); padding: 0 2px; }
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-direction: row-reverse; }
button.show { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
button.show.on { background: var(--accent); color: var(--accent-ink); }
.card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pick .opt span { min-height: 44px; font: 600 18px var(--f-display); color: var(--ink); }
</style>

<script>
const STUDY = {"version": 2, "selection": "random", "others": ["Qwen3.6_base", "Claude_Haiku", "Gemini_Flash", "GPT5.4_nano", "Tool"], "verify": [{"id": "V|tabular|adult_tabnn|q1|26148", "modality": "tabular", "dataset": "adult_tabnn", "q": "q1", "instance": "26148", "task": "Adult Census income", "question": "The model predicted the individual's income to be greater than 50K. Which input features were most responsible for this prediction?", "prediction": "greater than 50K", "truth": null, "focus": null, "input": {"kind": "table", "rows": [["age", "37"], ["workclass", "Private"], ["fnlwgt", "227545"], ["education", "Some-college"], ["education-num", "10"], ["marital-status", "Married-civ-spouse"], ["occupation", "Sales"], ["relationship", "Husband"], ["race", "White"], ["sex", "Male"], ["capital-gain", "0"], ["capital-loss", "0"], ["hours-per-week", "44"], ["native-country", "United-States"]]}, "expl": {"answer": {"features": ["marital-status", "relationship", "native-country", "sex"], "spans": [], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "The sensitivity analysis indicates that ablating these features causes the largest drops in prediction probability for the >50K class. Specifically, 'marital-status' has the highest importance with a probability drop of 0.0902, followed by 'relationship' at 0.0729. These features are the most critical drivers supporting the model's high-income prediction."}}, {"id": "V|tabular|adult_tabnn|q1|37319", "modality": "tabular", "dataset": "adult_tabnn", "q": "q1", "instance": "37319", "task": "Adult Census income", "question": "The model predicted the individual's income to be greater than 50K. Which input features were most responsible for this prediction?", "prediction": "greater than 50K", "truth": null, "focus": null, "input": {"kind": "table", "rows": [["age", "34"], ["workclass", "Private"], ["fnlwgt", "163110"], ["education", "Bachelors"], ["education-num", "13"], ["marital-status", "Married-civ-spouse"], ["occupation", "Craft-repair"], ["relationship", "Husband"], ["race", "White"], ["sex", "Male"], ["capital-gain", "0"], ["capital-loss", "0"], ["hours-per-week", "45"], ["native-country", "United-States"]]}, "expl": {"answer": {"features": ["marital-status", "relationship", "education-num", "sex"], "spans": [], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "The sensitivity analysis indicates that ablating these features results in the largest drops in prediction probability for the >50K class. Specifically, 'marital-status' has the highest importance with a probability drop of 0.0606, followed closely by 'relationship' and 'education-num'. These features are therefore the most critical drivers behind the model's high-confidence prediction."}}, {"id": "V|tabular|adult_2layernn|q5|32162", "modality": "tabular", "dataset": "adult_2layernn", "q": "q5", "instance": "32162", "task": "Adult Census income", "question": "The model predicted the individual\u2019s income to be less than or equal to 50K. If we mask the occupation feature of this input, would the prediction change?", "prediction": "less than or equal to 50K", "truth": null, "focus": {"features": ["occupation"]}, "input": {"kind": "table", "rows": [["age", "30"], ["workclass", "Private"], ["fnlwgt", "302473"], ["education", "HS-grad"], ["education-num", "9"], ["marital-status", "Never-married"], ["occupation", "Adm-clerical"], ["relationship", "Own-child"], ["race", "White"], ["sex", "Female"], ["capital-gain", "0"], ["capital-loss", "0"], ["hours-per-week", "40"], ["native-country", "United-States"]]}, "expl": {"answer": {"features": [], "spans": [], "box": null, "line": "Answer: the prediction would not change."}, "text": "The sensitivity analysis shows that masking the 'occupation' feature results in a very small probability drop of only 0.0252, reducing the confidence from 0.6687 to 0.6436. This indicates that the feature has low importance relative to others like 'marital-status', and the predicted class probability remains well above the decision threshold, so the prediction will not change."}}, {"id": "V|tabular|adult_2layernn|q8|24699", "modality": "tabular", "dataset": "adult_2layernn", "q": "q8", "instance": "24699", "task": "Adult Census income", "question": "The model predicted the individual to be >50K (True label was <=50K). Is there any irrelevant part in this input that causes the model\u2019s wrong prediction?", "prediction": ">50K", "truth": "<=50K", "focus": null, "input": {"kind": "table", "rows": [["age", "31"], ["workclass", "Private"], ["fnlwgt", "369825"], ["education", "Bachelors"], ["education-num", "13"], ["marital-status", "Never-married"], ["occupation", "Sales"], ["relationship", "Not-in-family"], ["race", "White"], ["sex", "Male"], ["capital-gain", "4101"], ["capital-loss", "0"], ["hours-per-week", "50"], ["native-country", "United-States"]]}, "expl": {"answer": {"features": ["fnlwgt", "capital-gain", "hours-per-week", "occupation"], "spans": [], "box": null, "line": "Highlighted: the irrelevant parts this explanation says caused the wrong prediction."}, "text": "These features have high positive attribution for the >50K class, driving the incorrect prediction. However, for a 31-year-old never-married individual, high capital gains or long working hours are not definitive indicators of high income without considering other factors like education or marital status which suggest lower earnings."}}, {"id": "V|text|snli_cnn|q1|117", "modality": "text", "dataset": "snli_cnn", "q": "q1", "instance": "117", "task": "SNLI sentence-pair inference", "question": "The model predicted the hypothesis to be contradiction. Which input features were most responsible for this prediction?", "prediction": "contradiction", "truth": null, "focus": null, "input": {"kind": "pair", "premise": "A woman working long hours.", "hypothesis": "A woman is sleeping."}, "expl": {"answer": {"features": [], "spans": ["hours", "long"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "The sensitivity analysis indicates that removing the words 'hours' and 'long' causes the largest decrease in the model's confidence for the contradiction class. This suggests that these terms are the most critical features supporting the prediction that the hypothesis contradicts the premise."}}, {"id": "V|text|snli_2layernn|q1|140", "modality": "text", "dataset": "snli_2layernn", "q": "q1", "instance": "140", "task": "SNLI sentence-pair inference", "question": "The model predicted the hypothesis to be neutral. Which input features were most responsible for this prediction?", "prediction": "neutral", "truth": null, "focus": null, "input": {"kind": "pair", "premise": "A professional swimmer spits water out after surfacing while grabbing the hand of someone helping him back to land.", "hypothesis": "The swimmer almost drowned after being sucked under a fast current."}, "expl": {"answer": {"features": [], "spans": ["hand", "spits"], "box": null, "line": "Highlighted: the parts this explanation says were most responsible."}, "text": "The sensitivity analysis indicates that masking the words 'hand' and 'spits' results in the highest increase in prediction probability for the neutral class, with probability drops of 0.0587 and 0.0335 respectively. This suggests that these specific features are the most critical evidence supporting the neutral classification, as their removal significantly weakens the model's confidence in this prediction."}}, {"id": "V|text|imdb_cnn|q5|16", "modality": "text", "dataset": "imdb_cnn", "q": "q5", "instance": "16", "task": "IMDB movie-review sentiment", "question": "The model predicted the review to be negative. If we mask the word 'italian' from this input, would the prediction change?", "prediction": "negative", "truth": null, "focus": {"spans": ["italian"]}, "input": {"kind": "text", "text": "This cheap, grainy-filmed Italian flick is about a couple of inheritors of a manor in the Italian countryside who head up to the house to stay, and then find themselves getting killed off by ghosts of people killed in that house.<br /><br />I wasn't impressed by this. It wasn't really that scary, mostly just the way a cheap Italian film should be. A girl, her two cousins, and one cousin's girlfriend, head to this huge house for some reason (I couldn't figure out why) and are staying there, cleaning up and checking out the place. Characters come in and out of the film, and it's quite boring at points, and the majority of deaths are quite rushed. The girlfriend is hit by a car when fleeing the house after having a dream of her death, and the scene is quite good, but then things get slow again, until a confusing end, when the male cousins are killed together in some weird way, and this weirdo guy (I couldn't figure out who he was during the movie, or maybe I just don't remember) goes after this one girl, attacking her, until finally this other girl kills him off. Hate to give away the ending, but oh well. The female cousin decides to stay at the house and watch over it, and they show scenes of her living there years later. The end. You really aren't missing anything, and anyway, you probably won't find this anywhere, so lucky you."}, "expl": {"answer": {"features": [], "spans": [], "box": null, "line": "Answer: the prediction would not change."}, "text": "The sensitivity analysis shows that masking the word 'italian' results in a negligible probability drop, as it is not among the most sensitive words affecting the prediction. The model's confidence remains extremely high even when other less critical words are removed, indicating that 'italian' has low importance for the negative classification."}}, {"id": "V|text|imdb_2layernn|q8|609", "modality": "text", "dataset": "imdb_2layernn", "q": "q8", "instance": "609", "task": "IMDB movie-review sentiment", "question": "The model predicted the review as positive (true label was negative). Is there any irrelevant part of the review that caused the wrong prediction?", "prediction": "positive", "truth": "negative", "focus": null, "input": {"kind": "text", "text": "First of all, I just wanna say that I'm a very big Naruto fan. I love the Anime and the Manga stories. Also, the first movie just confirmed that Naruto is all about great fun, great action, great story, ... But then came the 2nd movie. I was very hyped because the first movie turned out great. But it didn't satisfy me one bit... The story was lame, action wasn't all that great... especially compared to the Anime series... same goes for the quality of animation. I found it very poorly... Could the story get any lamer... ANY ??? Where's the kyuubi of Naruto ?? Not once does he turn demon... I mean ... COME ON !!! My advice is... see the series ( until episode 140 , then it's just fillers ) and then read the Manga because that's still great. Ignore this movie and hope for something better in the future...<br /><br />All and all I gave it a 4, just because it's Naruto..."}, "expl": {"answer": {"features": [], "spans": ["great fun", "great action", "great story", "satisfy", "great"], "box": null, "line": "Highlighted: the irrelevant parts this explanation says caused the wrong prediction."}, "text": "The model incorrectly predicts positive sentiment largely due to the high frequency of strong positive sentiment words like 'great' and 'fun', which appear in the context of praising the previous movie or series rather than the current one being reviewed. These words create a spurious correlation with positive sentiment, overriding the actual negative critique of the second movie's plot and animation quality."}}, {"id": "V|vision|stl10_densenet|q1|31", "modality": "vision", "dataset": "stl10_densenet", "q": "q1", "instance": "31", "task": "STL-10 object category", "question": "The model predicted the image to be a horse. Which part of t const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rngFrom(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* ---------- assignment ---------- */
function balancedPick(bank, n, keyFn, rnd) {
  const groups = {};
  for (const it of shuffle(bank, rnd)) (groups[keyFn(it)] ||= []).push(it);
  const keys = shuffle(Object.keys(groups), rnd), out = [];
  while (out.length < n && keys.some(k => groups[k].length)) for (const k of keys) { if (groups[k].length && out.length < n) out.push(groups[k].shift()); }
  return out;
}
function buildPlan(pid) {
  const rnd = rngFrom(hash(pid));
  // q1 (the most intuitive question) gets CONFIG.q1Share of each part; the rest is balanced over modality x question
  const pickWithQ1 = (bank, n) => {
    const n1 = Math.round(n * CONFIG.q1Share);
    const a = balancedPick(bank.filter(r => r.q === "q1"), n1, r => r.modality, rnd);
    const b = balancedPick(bank.filter(r => r.q !== "q1"), n - a.length, r => r.modality + r.q, rnd);
    return shuffle([...a, ...b], rnd);
  };
  const verify = pickWithQ1(STUDY.verify, Math.min(CONFIG.nVerify, STUDY.verify.length)).map(r => ({ id: r.id }));
  // Part 2: MEA + (perScreen-1) others; balance how often each other method is shown
  const seen = Object.fromEntries(STUDY.others.map(m => [m, 0]));
  const rank = pickWithQ1(STUDY.rank, Math.min(CONFIG.nRank, STUDY.rank.length)).map(r => {
    const avail = shuffle(Object.keys(r.expl).filter(m => m !== "MEA"), rnd).sort((a, b) => seen[a] - seen[b]);
    const chosen = avail.slice(0, CONFIG.perScreen - 1);
    chosen.forEach(m => seen[m]++);
    return { id: r.id, order: shuffle(["MEA", ...chosen], rnd) };
  });
  if (verify.length > 2) verify[Math.floor(verify.length / 2)].attn = true;
  if (rank.length > 2) rank[Math.floor(rank.length / 2)].attn = true;
  return { verify, rank };
}

function highlightText(text, spans, focus) {
  // spans -> yellow <mark> (explanation); focus -> blue outline (part the question asks about)
  const lower = text.toLowerCase(), ivs = [];
  const add = (list, cls) => [...new Set((list || []).filter(s => s && s.trim()))].sort((a, b) => b.length - a.length).forEach(s => {
    const needle = s.toLowerCase().trim(); let from = 0, at;
    while ((at = lower.indexOf(needle, from)) !== -1) {
      const end = at + needle.length;
      const boundaryOk = needle.length > 3 || ((at === 0 || !/\w/.test(lower[at - 1])) && (end >= lower.length || !/\w/.test(lower[end])));
      if (boundaryOk && !ivs.some(([a, b]) => at < b && end > a)) ivs.push([at, end, cls]);
      from = end;
    }
  });
  add(focus, "focus");
  add(spans, "mark");
  ivs.sort((a, b) => a[0] - b[0]);
  let out = "", pos = 0;
  for (const [a, b, cls] of ivs) {
    const seg = esc(text.slice(a, b));
    out += esc(text.slice(pos, a)) + (cls === "mark" ? `<mark>${seg}</mark>` : `<span class="focus">${seg}</span>`);
    pos = b;
  }
  return out + esc(text.slice(pos));
}
function renderInput(item, ans) {
  const inp = item.input, fo = item.focus || {};
  if (inp.kind === "table") {
    const hi = new Set((ans?.features || []).map(f => f.toLowerCase()));
    const fc = new Set((fo.features || []).map(f => f.toLowerCase()));
    return `<div class="table-wrap"><table class="feat">${inp.rows.map(row => {
      const [k, v] = row, kk = k.toLowerCase();
      let name = hi.has(kk) ? `<mark>${esc(k)}</mark>` : esc(k);
      if (fc.has(kk)) name = `<span class="focus">${name}</span>`;
      const fd = featureDesc(item, k), vd = valueDesc(item, row);
      return `<tr><td>${name}${fd ? `<div class="fdesc">${esc(fd)}</div>` : ""}</td><td>${esc(v)}${vd ? `<div class="fdesc">${esc(vd)}</div>` : ""}</td></tr>`;
    }).join("")}</table></div>`;
  }
  if (inp.kind === "text") return `<div class="textbox">${highlightText(inp.text, ans?.spans, fo.spans)}</div>`;
  if (inp.kind === "pair") return `<div class="pairbox"><span>Premise</span><div class="textbox">${highlightText(inp.premise, ans?.spans, fo.spans)}</div><span>Hypothesis</span><div class="textbox">${highlightText(inp.hypothesis, ans?.spans, fo.spans)}</div></div>`;
  if (inp.kind === "image") return imageWithBox(inp, ans?.box);
  return "";
}

    if (!st || st.pid !== pid || !st.plan || !Array.isArray(st.plan.verify) || !Array.isArray(st.plan.rank)) return false;
    const vids = new Set(STUDY.verify.map(r => r.id)), rids = new Set(STUDY.rank.map(r => r.id));
    if (!st.plan.verify.every(t => vids.has(t.id)) || !st.plan.rank.every(t => rids.has(t.id))) return false;
    const n = 6 + st.plan.verify.length + st.plan.rank.length;
    return Number.isInteger(st.step) && st.step >= 0 && st.step < n && Array.isArray(st.responses);
  } catch (e) { return false; }
}
function resetProgress() {
  try { localStorage.removeItem("mea_state_" + CONFIG.studyVersion); } catch (e) {}
}
function init() {
  const pid = getPid();
  const saved = load("mea_state_" + CONFIG.studyVersion);
  S = STUDY && validState(saved, pid) ? saved : { pid, plan: buildPlan(pid), step: 0, responses: [], survey: null, started: Date.now() };
  safeRender();
}
function safeRender() {
  try { render(); }
  catch (e) {
    console.error(e);
    $("#app").innerHTML = `<div class="panel"><h2>Something went wrong</h2><p>The page could not show this step. Starting over usually fixes it.</p>
      <div class="row" style="justify-content:flex-start"><button id="reset" type="button">Start over</button></div></div>`;
    $("#reset").onclick = () => { resetProgress(); S = null; init(); };
  }
}
function steps() { return ["welcome", "howto", "verifyIntro", ...S.plan.verify.map((_, i) => "verify" + i), "rankIntro", ...S.plan.rank.map((_, i) => "rank" + i), "survey", "done"]; }
function save() { store("mea_state_" + CONFIG.studyVersion, S); }
function next() { S.step++; save(); safeRender(); window.scrollTo(0, 0); }

function render() {
  const cur = steps()[S.step], app = $("#app");
  const nTrials = S.plan.verify.length + S.plan.rank.length;
  $("#progbar").style.width = (100 * S.responses.length / Math.max(1, nTrials)) + "%";
  $("#progtxt").textContent = /^verify\d/.test(cur) ? `Part 1 · ${+cur.slice(6) + 1} of ${S.plan.verify.length}`
    : /^rank\d/.test(cur) ? `Part 2 · ${+cur.slice(4) + 1} of ${S.plan.rank.length}` : cur === "done" ? "Finished" : "";
  tStart = performance.now();
  if (!STUDY) { app.innerHTML = `<div class="panel"><p class="err">Study data is missing. Rebuild the page with build_study.py.</p></div>`; return; }
  if (cur === "welcome") return renderWelcome(app);
  if (cur === "howto") return renderHowto(app);
  if (cur === "verifyIntro") return renderIntro(app, "Part 1 of 2", "Rate an explanation",
    `<p>Each screen shows an input, the model's prediction, a question about the model, and one explanation that answers it.</p>
     <p>Read the explanation and answer three questions about it. There are no right or wrong answers; we want your judgment.</p>`);
  if (cur === "rankIntro") return renderIntro(app, "Part 2 of 2", "Pick the best and the worst",
    `<p>Each screen shows one input and question with <b>${CONFIG.perScreen} explanations</b>, labelled A to ${LETTERS[CONFIG.perScreen - 1]}, produced by different explanation systems. Some give a written justification, some only highlight parts of the input.</p>
     <p>Choose the explanation that looks <b>most faithful</b>, meaning it most accurately describes what the model relied on, and the one that looks <b>least faithful</b>.</p>`);
  if (/^verify\d/.test(cur)) return renderVerify(app, +cur.slice(6));
  if (/^rank\d/.test(cur)) return renderRank(app, +cur.slice(4));
  if (cur === "survey") return renderSurvey(app);
  if (cur === "done") return renderDone(app);
}

function renderWelcome(app) {
  app.innerHTML = `<div class="stack"><div class="eyebrow">Research study · about 15 minutes</div>
   <h1>How useful are explanations of AI predictions?</h1>
   <p>AI models that classify data, such as product reviews, medical measurements or photos, are often paired with systems that explain their predictions. We are studying which explanations people find useful.</p></div>
   <div class="panel"><h2>Consent</h2>
   <p class="hint">[Placeholder: insert the IRB-approved consent text here, including the protocol number, the investigators' contact details, compensation, and data handling.]</p>
   <ul class="plain"><li>Participation is voluntary; you may stop at any time by closing this page.</li>
   <li>We record your answers and how long each screen takes. We do not collect your name.</li></ul>
   <label class="row" style="justify-content:flex-start"><input type="checkbox" id="consent"> I am 18 or older and agree to take part.</label>
   <div class="row"><button id="go" disabled>Start</button></div></div>`;
  $("#consent").onchange = e => $("#go").disabled = !e.target.checked;
  $("#go").onclick = next;
}
function renderHowto(app) {
  app.innerHTML = `<div class="stack"><div class="eyebrow">Before you start</div><h2>How to read an explanation</h2></div>
  <div class="panel">
   <p>An explanation can have up to three parts:</p>
   <ul class="plain"><li><b>An answer</b> to the question asked about the model.</li>
   <li><b>Highlighted parts</b> of the input that the explanation points to, marked <mark>like this</mark>. For images, a yellow box marks a region.</li>
   <li><b>A written justification</b> of why the model behaves this way.</li></ul>
   <p>Example of a highlighted review:</p>
   <div class="textbox">${highlightText("A warm, funny film with a weak ending.", ["warm", "funny"])}</div>
   <p><b>What “faithful” means.</b> An explanation is faithful if it accurately describes what <i>this model</i> actually relied on to make its prediction. Models do not always reason the way people do: sometimes they rely on parts of the input a person would find odd. A faithful explanation reports what the model used, even when that differs from how you would decide.</p>
   <p class="hint">You do not need to know how the model works. Use the highlighted parts, the answer and the written justification.</p>
   <div class="row"><button id="go">Continue</button></div></div>`;
  $("#go").onclick = next;
}
function renderIntro(app, eyebrow, title, body) {
  app.innerHTML = `<div class="stack"><div class="eyebrow">${eyebrow}</div><h2>${title}</h2></div><div class="panel">${body}<div class="row"><button id="go">Begin</button></div></div>`;
  $("#go").onclick = next;
}

function renderVerify(app, i) {
  const t = S.plan.verify[i], item = STUDY.verify.find(r => r.id === t.id), ex = item.expl;
  const qs = [["consist", "How well does the written justification agree with the explanation's answer and highlighted parts?", "not at all", "completely"],
    ["help", "How helpful is this explanation for understanding the model's decision?", "not helpful", "very helpful"],
    ["clear", "How easy is this explanation to understand?", "very hard", "very easy"]];
  app.innerHTML = `
   <div class="panel">${header(item)}<div class="eyebrow">Input</div>${renderInput(item, ex.answer)}${inputLegend(item, !!(ex.answer.features?.length || ex.answer.spans?.length || ex.answer.box))}</div>
   <div class="cards" style="grid-template-columns:1fr">${explanationCard(item, ex, "")}</div>
   <div class="panel">${qs.map(q => likert(...q)).join("")}
    ${t.attn ? `<div class="check"><b>Attention check.</b> This question is not about the explanation. Please select <b>2</b>.<div class="likert" style="margin-top:8px">${[1, 2, 3, 4, 5].map(v => `<label class="opt"><input type="radio" name="attn" value="${v}" id="attn_${v}"><span>${v}</span></label>`).join("")}</div></div>` : ""}
    <label for="cmt" class="hint">Optional: anything wrong or confusing in this explanation?</label><textarea id="cmt" rows="2"></textarea>
    <div class="row"><span class="err" id="err"></span><button id="go">Next</button></div></div>`;
  $("#go").onclick = () => {
    const r = {};
    for (const [k] of qs.concat(t.attn ? [["attn"]] : [])) { const v = val(k); if (v == null) { $("#err").textContent = "Please answer every question to continue."; return; } r[k] = +v; }
    const attn = t.attn ? r.attn === 2 : undefined; delete r.attn;
    S.responses.push({ block: "rate", id: t.id, modality: item.modality, q: item.q, ratings: r, attn, comment: $("#cmt").value.trim(), rt_ms: Math.round(performance.now() - tStart) });
    next();
  };
}

function renderRank(app, i) {
  const t = S.plan.rank[i], item = STUDY.rank.find(r => r.id === t.id), n = t.order.length;
  app.innerHTML = `
   <div class="panel">${header(item)}<div class="row" style="justify-content:space-between"><div class="eyebrow">Input</div><span class="hint" id="showing">Click “Show in input” on an explanation to see its highlights here.</span></div><div id="inp">${renderInput(item)}</div>${inputLegend(item, false)}</div>
   <div class="cards4">${t.order.map((m, k) => explanationCard(item, item.expl[m], LETTERS[k]).replace('<h3>', `<h3 class="cardhead"><button class="ghost show" data-k="${k}" type="button">Show in input</button>`)).join("")}</div>
   <div class="panel">
    ${pick("best", "Which explanation looks the most faithful, i.e. most accurately describes what the model relied on?", n)}
    ${pick("worst", "Which explanation looks the least faithful?", n)}
    ${t.attn ? pick("attn", "Attention check: please select C here.", n) : ""}
    <label for="cmt" class="hint">Optional: why did you choose these?</label><textarea id="cmt" rows="2"></textarea>
    <div class="row"><span class="err" id="err"></span><button id="go">Next</button></div></div>`;
  const views = [];
  document.querySelectorAll("button.show").forEach(btn => btn.onclick = () => {
    const k = +btn.dataset.k, on = !btn.classList.contains("on");
    document.querySelectorAll("button.show").forEach(b => { b.classList.remove("on"); b.textContent = "Show in input"; b.closest(".card").classList.remove("active"); });
    if (on) { btn.classList.add("on"); btn.textContent = "Showing"; btn.closest(".card").classList.add("active"); views.push(LETTERS[k]); }
    $("#inp").innerHTML = renderInput(item, on ? item.expl[t.order[k]].answer : null);
    $("#showing").textContent = on ? `Showing highlights from explanation ${LETTERS[k]}.` : "Click “Show in input” on an explanation to see its highlights here.";
  });
  $("#go").onclick = () => {
    const best = val("best"), worst = val("worst"), attn = t.attn ? val("attn") : "na";
    if (best == null || worst == null || attn == null) { $("#err").textContent = "Please answer every question to continue."; return; }
    if (best === worst) { $("#err").textContent = "The most and least faithful explanations must be different."; return; }
    const m = L => t.order[LETTERS.indexOf(L)];
    S.responses.push({ block: "rank", id: t.id, modality: item.modality, q: item.q, shown: t.order, best: m(best), worst: m(worst),
      attn: t.attn ? attn === "C" : undefined, viewed: views.map(m), comment: $("#cmt").value.trim(), rt_ms: Math.round(performance.now() - tStart) });
    next();
  };
}

function renderSurvey(app) {
  app.innerHTML = `<div class="stack"><div class="eyebrow">Almost done</div><h2>A few questions about you</h2></div>
   <div class="panel">
    ${likert("ml", "How familiar are you with machine learning?", "not at all", "I work with it")}
    ${likert("ai", "How often do you use AI tools such as chatbots?", "never", "daily")}
    <label for="cm" class="hint">Any other comments on the explanations you saw?</label><textarea id="cm" rows="3"></textarea>
    <div class="row"><span class="err" id="err"></span><button id="go">Finish</button></div></div>`;
  $("#go").onclick = () => {
    const ml = val("ml"), ai = val("ai");
    if (ml == null || ai == null) { $("#err").textContent = "Please answer both rating questions."; return; }
    S.survey = { ml: +ml, ai: +ai, comment: $("#cm").value.trim() }; S.finished = Date.now(); next();
  };
}

/* Saving: (1) inside a claude.ai artifact with a signed-in viewer -> the artifact's database;
   (2) otherwise, if CONFIG.submitUrl is set -> POST to that backend (e.g. Google Apps Script);
   the participant never sees the raw responses. */
async function saveResponses(payload) {
  try {
    const db = window.claude?.use ? await window.claude.use("db") : null;
    const user = db ? await window.claude.use("user") : null;
    if (db && user) {
      const id = await user.id();
      await db.doc("responses/" + id).set({ ...payload, saved_at: Date.now() });
      return "saved";
    }
  } catch (e) { /* fall through to the HTTP backend */ }
  if (CONFIG.datapipeId) {
    // DataPipe (pipe.jspsych.org) stores one file per participant in your OSF project.
    const fname = `${payload.study}__${String(payload.pid).replace(/[^A-Za-z0-9_-]/g, "")}_${Date.now()}.json`;
    const r = await fetch("https://pipe.jspsych.org/api/data/", {
      method: "POST", headers: { "Content-Type": "application/json", Accept: "*/*" },
      body: JSON.stringify({ experimentID: CONFIG.datapipeId, filename: fname, data: JSON.stringify(payload) }) });
    if (!r.ok) throw new Error("DataPipe HTTP " + r.status);
    return "saved";
  }
  if (CONFIG.submitUrl) {
    const sameSite = CONFIG.submitUrl.startsWith("/") || new URL(CONFIG.submitUrl, location.href).origin === location.origin;
    if (sameSite) {
      // own server (e.g. the Flask app): a normal request whose result we can check
      const r = await fetch(CONFIG.submitUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return "saved";
    }
    // another site (e.g. Google Apps Script): text/plain avoids a CORS preflight; no-cors because the
    // response cannot be read cross-origin. The row is written regardless.
    await fetch(CONFIG.submitUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    return "sent";
  }
  return "none";
}

async function renderDone(app) {
  const payload = { study: CONFIG.studyVersion, pid: S.pid, started: S.started, finished: S.finished, plan: S.plan, responses: S.responses, survey: S.survey, ua: navigator.userAgent };
  const testing = location.hash === "#test";
  app.innerHTML = `<div class="stack"><div class="eyebrow">Finished</div><h1>Thank you</h1>
   <p id="sub">Saving your responses…</p>
   <div id="codebox" hidden><p>Your completion code:</p><span class="code">${esc(CONFIG.completionCode)}</span></div>
   <div class="row" style="justify-content:flex-start"><button id="retry" hidden>Try saving again</button>
   ${CONFIG.completionUrl ? `<a id="back" hidden href="${esc(CONFIG.completionUrl)}"><button type="button">Return to the study site</button></a>` : ""}
   ${testing ? `<button class="ghost" id="restart" type="button">Start over (testing)</button>` : ""}</div></div>`;
  if (testing) $("#restart").onclick = () => { try { localStorage.removeItem("mea_state_" + CONFIG.studyVersion); localStorage.removeItem("mea_pid"); } catch (e) {} init(); };
  const attempt = async () => {
    $("#retry").hidden = true; $("#sub").textContent = "Saving your responses…";
    let res;
    try { res = S.submitted ? "saved" : await saveResponses(payload); } catch (e) { res = "error"; }
    if (res === "saved" || res === "sent") {
      S.submitted = true; save();
      $("#sub").textContent = "Your responses have been recorded. Thank you for taking part!";
      if (CONFIG.completionCode) $("#codebox").hidden = false;
      if ($("#back")) $("#back").hidden = false;
    } else if (res === "none") {
      $("#sub").textContent = "This copy of the study is not connected to a server, so your responses were not recorded. Please contact the research team.";
    } else {
      $("#sub").textContent = "We could not save your responses. Please check your connection and try again; your answers are kept in this browser.";
      $("#retry").hidden = false;
    }
  };
  $("#retry").onclick = attempt;
  attempt();
}

init();
</script>
</body></html>
